name: OSV-Scanner

# Hledá známé zranitelnosti v závislostech (backend/uv.lock, frontend/package-lock.json).
# PR: selže jen při nově přidané zranitelnosti. Push/týdně: plný sken do Security > Code scanning.

on:
  pull_request:
    branches: [dev, main]
  merge_group:
    branches: [dev, main]
  push:
    branches: [dev]
  schedule:
    - cron: "30 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0

  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
