name: Check Frontend Audit

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
          - uses: actions/checkout@v6

          - name: Set up Node.js
            uses: actions/setup-node@v3
            with:
              node-version: 22

          - name: Install dependencies
            working-directory: ./frontend
            run: npm ci

          - name: Audit production dependencies
            working-directory: ./frontend
            run: npm audit --omit=dev --audit-level=high

          # Pozn.: `tsc --noEmit` ani `next build` tu zatím běžet nemůžou.
          # Klient v `frontend/src/api/` se generuje z běžícího backendu
          # (`npm run generate:openapi`) a je v .gitignore, takže v CI chybí
          # a typová kontrola by spadla na `Cannot find module '@/api'`.
          # Aby šly zapnout, musel by se generovaný klient buď commitovat,
          # nebo generovat v pipeline proti nastartovanému backendu.

          # Warnings zatím jen reportovat.
          - name: Lint
            working-directory: ./frontend
            run: npx eslint
            continue-on-error: true
