[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "fastapi>=0.162.4",
    "uvicorn>=0.54.0",
    "psycopg[binary]==3.3.2",
    "pydantic-settings>=2.16.2",
    # ruff-action si bere verzi odsud
    "ruff>=0.16.0,<0.17",
    "sqlalchemy>=2.1.8",
    "unstructured[md]>=0.27.37",
    "pgvector==0.3.0",
    "langgraph>=1.2.20",
    "langchain-openai>=1.7.4",
    "langchain-anthropic>=1.7.10",
    "python-multipart>=0.0.33",
    "python-keycloak>=7.1.1",
    "langchain>=1.4.9",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langchain-core>=1.7.7",
    "gunicorn>=27.0.0",
    "filetype>=1.2.0",
    "langchain-community>=0.4.2",
    "apscheduler>=3.11.3",
    "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1.9",
    "pillow>=13.0.0",
    "websockets>=13,<16",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "A",  # prevent using keywords that clobber python builtins
    "B",  # bugbear: security warnings
    "E",  # pycodestyle
    "F",  # pyflakes
    "ISC",  # implicit string concatenation
    "UP",  # alert you when better syntax is available in your python version
    "N",   # pep8-naming
    "PTH",  # use pathlib
]
preview = true
ignore = ["E501", "E712", "E711"]  # zbytecne to rve, co lze upravit formatter upravi

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
